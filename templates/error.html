<!doctype html>
<html lang="{{ html_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <title>{{ status_code }} · {{ error_title }} · {{ t('app.title') }}</title>
  <style>
    :root { color-scheme:dark; --bg:#070b14; --muted:#94a3b8; --text:#e5e7eb; --line:#263247; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
    main { width:min(560px,calc(100% - 32px)); }
    .topbar { display:flex; justify-content:flex-end; margin-bottom:12px; }
    .panel { padding:32px; border:1px solid var(--line); border-radius:15px; background:linear-gradient(145deg,#141d2e,#0f1725); box-shadow:0 14px 35px #0004; }
    .code { color:#60a5fa; font-size:13px; font-weight:750; letter-spacing:.08em; }
    h1 { margin:8px 0; font-size:clamp(28px,6vw,40px); letter-spacing:-.035em; }
    p { margin:0 0 24px; color:var(--muted); }
    .back { color:#dbeafe; text-decoration:none; }
    .back:hover { text-decoration:underline; }
    .language-switcher { display:flex; align-items:center; gap:3px; padding:3px; border:1px solid #334155; border-radius:10px; background:#0b1220; }
    .language-option { color:#94a3b8; text-decoration:none; border-radius:7px; padding:4px 8px; font-size:11px; font-weight:700; white-space:nowrap; }
    .language-option:hover { color:#e2e8f0; background:#172033; }
    .language-option.active { color:#eff6ff; background:#1d4ed8; }
    .language-option:focus-visible { outline:2px solid #93c5fd; outline-offset:2px; }
  </style>
</head>
<body>
<main>
  <div class="topbar">{% include '_language_switcher.html' %}</div>
  <section class="panel">
    <div class="code">{{ status_code }}</div>
    <h1>{{ error_title }}</h1>
    <p>{{ error_message }}</p>
    <a class="back" href="{{ url_for('index', lang=current_language) }}">{{ t('error.back') }}</a>
  </section>
</main>
</body>
</html>
